name: Deploy frontend

# The repo's default branch is claude/epic-goldberg-qj4EC (there is no `main`);
# the previous trigger chained off CI@main and therefore never fired — Pages
# sat on a May 31 build while features kept merging. Trigger on pushes to the
# real default branch instead.
on:
  push:
    branches: [claude/epic-goldberg-qj4EC]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # push the build to the gh-pages branch
      pages: write # and/or publish via the Pages Actions API
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build frontend
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: npm --workspace frontend run build

      # The repo's Pages source setting is not visible from the workflow, so
      # publish through both supported mechanisms; the one matching the
      # setting takes effect and the other is inert.
      # 1. Classic: push the build to the gh-pages branch (what produced the
      #    currently-live site).
      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./frontend/dist
          force_orphan: true
      # 2. Actions-based Pages deploy. Fails harmlessly when the Pages source
      #    is set to "deploy from a branch", hence continue-on-error.
      - name: Setup Pages
        id: setup_pages
        continue-on-error: true
        uses: actions/configure-pages@v5
      - name: Upload artifact
        if: steps.setup_pages.outcome == 'success'
        continue-on-error: true
        id: upload_pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./frontend/dist
      - name: Deploy to GitHub Pages
        if: steps.upload_pages.outcome == 'success'
        continue-on-error: true
        uses: actions/deploy-pages@v4
