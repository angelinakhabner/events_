name: Deploy frontend

# The repo's default branch is claude/epic-goldberg-qj4EC (there is no `main`);
# it acts as production. The `dev` branch is the staging line: every push to it
# redeploys a password-gated preview at /dev/, while the default branch keeps
# serving the root of the Pages site. Both builds ship in one Pages artifact
# because a repo only gets a single Pages deployment.
#
# The site is served from the custom domain below, so both builds are rooted at
# the domain apex rather than the /<repo>/ subpath Pages uses by default.
on:
  push:
    branches: [claude/epic-goldberg-qj4EC, dev]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # SHA-256 of the dev-preview password (the password itself is not in the
  # repo). Baked only into the /dev/ build; production builds skip the gate.
  DEV_GATE_HASH: 87274af01876341455b32d805946f272871bb42effa6604dccf28bb027afa82b
  # Custom domain for the Pages site. Must match the value in the repo's
  # Settings → Pages → Custom domain, and is republished on every deploy (see
  # the CNAME handling below). Changing it here without changing it there — or
  # vice versa — takes the site down.
  CUSTOM_DOMAIN: afisz.cc

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # push the build to the gh-pages branch
      pages: write # and/or publish via the Pages Actions API
      id-token: write
    steps:
      - name: Checkout production (default branch)
        uses: actions/checkout@v4
        with:
          ref: claude/epic-goldberg-qj4EC
          path: prod

      - name: Checkout dev branch
        id: checkout_dev
        continue-on-error: true # tolerate the dev branch not existing yet
        uses: actions/checkout@v4
        with:
          ref: dev
          path: dev

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: prod/package-lock.json

      - name: Build production frontend
        working-directory: prod
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          # Root of the custom domain, not /<repo>/ — the asset URLs, the
          # BrowserRouter basename (frontend/src/main.tsx) and share links
          # (frontend/src/lib/share.ts) all derive from this.
          VITE_BASE_PATH: /
        run: |
          npm ci
          npm --workspace frontend run build

      - name: Build dev-preview frontend
        if: steps.checkout_dev.outcome == 'success'
        working-directory: dev
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_BASE_PATH: /dev/
          VITE_DEV_GATE_HASH: ${{ env.DEV_GATE_HASH }}
        run: |
          npm ci
          npm --workspace frontend run build

      - name: Assemble combined site (prod at /, dev at /dev/)
        run: |
          mkdir -p site
          cp -r prod/frontend/dist/. site/
          if [ -d dev/frontend/dist ]; then
            mkdir -p site/dev
            cp -r dev/frontend/dist/. site/dev/
          fi
          # SPA fallback. The app uses BrowserRouter, so deep links like
          # /auth?token=… (the magic-link login landing) have no file on disk
          # and Pages would answer with its own 404 page. Serving the built
          # index.html as 404.html hands those URLs to the router instead; the
          # browser keeps the path and query string, and the bundle's asset URLs
          # are absolute, so it boots correctly from any depth.
          cp site/index.html site/404.html
          if [ -f site/dev/index.html ]; then
            cp site/dev/index.html site/dev/404.html
          fi
          # Custom domain. Pages reads the domain from a CNAME file in the
          # published site, so it has to be re-created on every deploy — the
          # gh-pages publish below runs with force_orphan, which wipes anything
          # not in this directory. Without this the custom domain silently
          # unsets itself on the next deploy and the site falls back to
          # <owner>.github.io/<repo>/, where the base path above is now wrong.
          echo "$CUSTOM_DOMAIN" > site/CNAME

      # The repo's Pages source setting is not visible from the workflow, so
      # publish through both supported mechanisms; the one matching the
      # setting takes effect and the other is inert.
      # 1. Classic: push the build to the gh-pages branch (what produced the
      #    currently-live site).
      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          force_orphan: true
          # Belt and braces with the CNAME file written above: that one covers
          # the Actions-based Pages deploy, this covers the gh-pages branch.
          cname: ${{ env.CUSTOM_DOMAIN }}
      # 2. Actions-based Pages deploy. Fails harmlessly when the Pages source
      #    is set to "deploy from a branch", hence continue-on-error.
      - name: Setup Pages
        id: setup_pages
        continue-on-error: true
        uses: actions/configure-pages@v5
      - name: Upload artifact
        if: steps.setup_pages.outcome == 'success'
        continue-on-error: true
        id: upload_pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
      - name: Deploy to GitHub Pages
        if: steps.upload_pages.outcome == 'success'
        continue-on-error: true
        uses: actions/deploy-pages@v4
