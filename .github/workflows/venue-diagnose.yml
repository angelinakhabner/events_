name: Venue diagnose

# TEMPORARY development helper — deleted once the scraper gaps are fixed.
#
# Dispatch-only on purpose: the trigger mode forces REAL production scrapes
# (admin.triggerScrape), which cost Anthropic tokens for LLM venues, so it must
# never run automatically on push.

on:
  workflow_dispatch:
    inputs:
      trigger:
        description: Comma-separated venue slugs to force-scrape in production
        default: ''
        required: false
      discover:
        description: Comma-separated venue slugs to run calendar-URL discovery on
        default: ''
        required: false
      analyze:
        description: Comma-separated venue slugs to run page content analysis on
        default: ''
        required: false
      probe:
        description: Comma-separated raw URLs to probe for scrapability + content density
        default: ''
        required: false
  # Registration-only: a dispatch-only workflow on a non-default branch never
  # gets registered with the Actions API. The job below skips push events.
  push:
    branches: [claude/venue-events-visibility-j27pfm]

permissions:
  contents: read

concurrency:
  group: venue-diagnose
  cancel-in-progress: false

jobs:
  diagnose:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run diagnostics
        working-directory: backend
        env:
          DIAG_API_URL: ${{ vars.VITE_API_URL }}
          DIAG_TRIGGER: ${{ github.event.inputs.trigger }}
          DIAG_DISCOVER: ${{ github.event.inputs.discover }}
          DIAG_ANALYZE: ${{ github.event.inputs.analyze }}
          DIAG_PROBE: ${{ github.event.inputs.probe }}
        run: npx tsx src/scripts/diagnose-venues.ts
