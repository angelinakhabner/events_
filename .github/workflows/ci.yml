name: CI

on:
  pull_request:
  push:
    # claude/epic-goldberg-qj4EC is the repo's default ("main") branch;
    # dev is the staging branch that deploys the gated /dev/ preview.
    branches: [main, claude/epic-goldberg-qj4EC, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: goin
          POSTGRES_PASSWORD: goin
          POSTGRES_DB: goin_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U goin"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://goin:goin@localhost:5432/goin_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run database migrations
        run: npm run db:migrate

      - name: Seed default venues
        # Mirrors the production start chain (migrate → seed → serve). Several
        # integration tests assume venues.list returns the Warsaw seed; without
        # this step the DB-backed venue store returns 0 rows in CI.
        run: npm --workspace backend run db:seed

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit + integration tests
        run: npm test
