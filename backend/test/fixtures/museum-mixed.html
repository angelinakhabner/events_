<!DOCTYPE html>
<html lang="pl">
<head><meta charset="utf-8"><title>Program — Muzeum Przykładowe</title></head>
<body>
  <main>
    <h1>Program</h1>

    <!-- A run: date range, no clock time anywhere on the card. -->
    <article class="wystawa">
      <h2><a href="https://muzeum.example/wystawa/trzy-przestrzenie">Trzy przestrzenie podziemne</a></h2>
      <p class="daty">12.06.2026 – 14.09.2026</p>
      <p class="opis">Interwencja w przestrzeni muzeum: trzy podziemne pomieszczenia otwarte dla publiczności.</p>
    </article>

    <!-- A single occurrence with a real hour. -->
    <article class="wydarzenie">
      <h2><a href="https://muzeum.example/wydarzenie/warsztaty-rysunku">Warsztaty rysunku</a></h2>
      <p class="daty">20.06.2026</p>
      <p class="godzina">17:30</p>
      <p class="opis">Warsztaty rysunku dla dorosłych, prowadzenie: Anna Nowak.</p>
    </article>
  </main>
</body>
</html>
